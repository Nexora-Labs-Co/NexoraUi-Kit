name: nexora_ui_kit
description: "Shared UI kit for Nexora suite applications."
version: 0.1.0
publish_to: 'none'

topics:
  - nexora
  - ui-kit
  - flutter
  - desktop
  - window

environment:
  sdk: ^3.13.7
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Gliker
      fonts:
        - asset: assets/fonts/Gliker-Regular.ttf
        - asset: assets/fonts/Gliker-Bold.ttf
          weight: 700
